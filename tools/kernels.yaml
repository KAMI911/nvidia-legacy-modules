# Per-ABI kernel matrix for the `modules` (kernel-matched .ko) flavour.
# gen-kernel-packages.py makes one source package per (series, target, ABI).
# pkg_ver "*" => Build-Depends is just linux-headers-<abi> (the ABI name is the
# real pin; a point-release bump keeps the ABI). Refresh with the current
# `linux-headers-<flavour>` metapackage target per suite (see docs).
#
# Debian 13 (trixie) dropped the i386 kernel — amd64 (+ rt) only there.

debian11:
  amd64:
  - { abi: 5.10.0-46-amd64,        pkg_ver: '*', src: archive, blocking: true }
  i386:
  - { abi: 5.10.0-46-686-pae,      pkg_ver: '*', src: archive, blocking: true }

debian12:
  amd64:
  - { abi: 6.1.0-52-amd64,         pkg_ver: '*', src: archive, blocking: true }
  - { abi: 6.1.0-52-rt-amd64,      pkg_ver: '*', src: archive, blocking: false, variant: rt }
  i386:
  - { abi: 6.1.0-52-686-pae,       pkg_ver: '*', src: archive, blocking: true }

debian13:
  amd64:
  - { abi: 6.12.94+deb13-amd64,     pkg_ver: '*', src: archive, blocking: true }
  - { abi: 6.12.94+deb13-rt-amd64,  pkg_ver: '*', src: archive, blocking: false, variant: rt }

ubuntu2004:
  amd64:
  - { abi: 5.4.0-216-generic,      pkg_ver: '*', src: archive, blocking: false }
  - { abi: 5.15.0-190-generic,     pkg_ver: '*', src: hwe,     blocking: false }

ubuntu2204:
  amd64:
  - { abi: 5.15.0-190-generic,     pkg_ver: '*', src: archive, blocking: true }
  - { abi: 6.8.0-138-generic,      pkg_ver: '*', src: hwe,     blocking: true }

ubuntu2404:
  amd64:
  - { abi: 6.8.0-139-generic,      pkg_ver: '*', src: archive, blocking: true }
  - { abi: 7.0.0-30-generic,       pkg_ver: '*', src: hwe,     blocking: true }

ubuntu2604:
  amd64:
  - { abi: 7.0.0-14-generic,       pkg_ver: '*', src: archive, blocking: true }

_mainline_sweep:
  note: non-blocking wide coverage for the DKMS-style compile check in tests/;
    gen makes per-ABI trees only for the real distro ABIs above.
  versions: ['6.14','6.15','6.16','6.17','6.18','6.19','7.0','7.1','7.2','7.3']
