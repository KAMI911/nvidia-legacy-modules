# X.Org configuration snippet for the NVIDIA 173.14.39 (173xx) driver.
# Copied to /etc/X11/xorg.conf.d/ by the kernel-support postinst if no admin
# copy exists there yet.
Section "Files"
    ModulePath "/usr/lib/xorg/modules/updates"
    ModulePath "/usr/lib/xorg/modules"
EndSection

Section "Module"
    Load "glx"
EndSection

Section "Device"
    Identifier  "nvidia-legacy-173xx"
    Driver      "nvidia"
    Option      "NoLogo" "true"
EndSection

Section "OutputClass"
    Identifier   "nvidia-legacy-173xx"
    MatchDriver  "nvidia"
    Driver       "nvidia"
EndSection
