# X.Org configuration snippet for the NVIDIA 340.108 (340xx) driver.
# Copied to /etc/X11/xorg.conf.d/ by the kernel-support postinst if no admin
# copy exists there yet.
Section "Files"
    ModulePath "/usr/lib/xorg/modules/updates"
    ModulePath "/usr/lib/xorg/modules"
EndSection

Section "Module"
    Load "glx"
EndSection

Section "Device"
    Identifier  "nvidia-legacy-340xx"
    Driver      "nvidia"
    Option      "NoLogo" "true"
EndSection

Section "OutputClass"
    Identifier   "nvidia-legacy-340xx"
    MatchDriver  "nvidia"
    Driver       "nvidia"
EndSection

# debian13 ships X server video ABI 25, newer than the
# 24 this driver was built for. Without this the server refuses to
# load nvidia_drv.so. Loading anyway is not guaranteed stable — best-effort.
Section "ServerFlags"
    Option "IgnoreABI" "1"
EndSection
