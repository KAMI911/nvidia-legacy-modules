# modprobe options for the NVIDIA 580.178.04 (580xx-open) driver.
# Rename target: nvidia-legacy-580xx-open.conf
alias char-major-195* nvidia
alias nvidia-current nvidia
options nvidia NVreg_DeviceFileMode=0660 NVreg_DeviceFileGID=44
# nvidia-drm modeset=1: KMS is stable on this series (Maxwell/Pascal/Volta+,
# open kernel modules) and required for Wayland/GBM. Override in a
# higher-priority modprobe.d file to disable.
options nvidia-drm modeset=1
softdep nvidia post: nvidia-modeset nvidia-uvm
