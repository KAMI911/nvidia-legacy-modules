name: autopkgtest

on:
  pull_request:
  workflow_call:
    inputs:
      full: { type: boolean, default: false }

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: "${{ steps.g.outputs.m }}"
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - id: g
        run: |
          SEL=""; [ "${{ inputs.full }}" = "true" ] || SEL="--series 390xx"
          echo "m=$(python3 .github/scripts/gen-matrix.py $SEL)" >> "$GITHUB_OUTPUT"

  autopkgtest:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/download-artifact@v4
        with:
          name: debs-${{ matrix.series }}-${{ matrix.target }}
          path: ../build
      - run: sudo apt-get update -qq && sudo apt-get install -y podman python3-yaml
      - name: install / purge / conflicts / xorg-abi
        run: tests/autopkgtest/run.sh ${{ matrix.series }} ${{ matrix.target }}
        continue-on-error: ${{ !matrix.blocking }}
