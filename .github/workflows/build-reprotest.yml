name: build-reprotest

on:
  pull_request:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: "${{ steps.g.outputs.m }}"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: pip install pyyaml
      - id: g
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            echo "m=$(python3 .github/scripts/gen-matrix.py)" >> "$GITHUB_OUTPUT"
          else
            echo "m=$(python3 .github/scripts/gen-matrix.py --series 390xx)" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - name: BUILDDIR
        # actions/upload-artifact@v4 rejects any ".." in its path patterns,
        # so scripts' own default ($ROOT/../build) can't be used there —
        # export the canonical absolute path once for every step to share.
        run: echo "BUILDDIR=$(realpath -m "$GITHUB_WORKSPACE/../build")" >> "$GITHUB_ENV"
      - name: host deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sbuild schroot debootstrap reprotest diffoscope \
            devscripts blhc python3-yaml xz-utils curl
          sudo sbuild-adduser "$USER" || true
      - name: cache upstream .run
        uses: actions/cache@v4
        with:
          path: ~/.cache/nvidia-legacy
          key: run-${{ matrix.series }}
      - name: verify upstream blobs
        run: common/scripts/verify-run.sh ${{ matrix.series }}
      - name: create chroot
        run: |
          set -e
          case "${{ matrix.target }}" in
            debian*)  MIR=http://deb.debian.org/debian ;;
            ubuntu*)  MIR=http://azure.archive.ubuntu.com/ubuntu ;;
          esac
          CN=$(python3 -c "import yaml;print(yaml.safe_load(open('common/drivers.yaml'))['targets']['${{ matrix.target }}']['codename'])")
          sudo sbuild-createchroot --make-sbuild-tarball=/srv/chroot/${CN}.tar.gz \
            "$CN" "$(mktemp -d)" "$MIR"
      - name: build (clean chroot, all arches)
        # sbuild-adduser (host deps step) only takes effect on a fresh login;
        # this shell never re-logged in, so the runner user's sbuild group
        # membership needs `sg` to become active for this step.
        run: sg sbuild -c ".github/scripts/sbuild-wrap.sh ${{ matrix.series }} ${{ matrix.target }}"
      - name: reprotest (bit-identical rebuild)
        run: .github/scripts/reprotest-wrap.sh ${{ matrix.series }} ${{ matrix.target }}
        continue-on-error: ${{ !matrix.blocking }}
      - name: upload sbuild logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sbuild-logs-${{ matrix.series }}-${{ matrix.target }}
          path: |
            ${{ env.BUILDDIR }}/*.build
            ${{ env.BUILDDIR }}/build-*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.series }}-${{ matrix.target }}
          path: |
            ${{ env.BUILDDIR }}/*.deb
            ${{ env.BUILDDIR }}/*.dsc
            ${{ env.BUILDDIR }}/*.tar.*
            ${{ env.BUILDDIR }}/*.buildinfo
            ${{ env.BUILDDIR }}/*.changes
