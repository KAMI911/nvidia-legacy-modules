name: module-build

on:
  # not pull_request: directly -- needs build-reprotest's artifact, see
  # pr-checks.yml for the properly ordered chain.
  workflow_call:
    inputs:
      full: { type: boolean, default: false }

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: "${{ steps.g.outputs.m }}"
    steps:
      - uses: actions/checkout@v5
      - run: pipx install pyyaml || pip install pyyaml
      - id: g
        run: |
          SEL=""; [ "${{ inputs.full }}" = "true" ] || SEL="--series 390xx"
          echo "m=$(python3 .github/scripts/gen-matrix.py $SEL)" >> "$GITHUB_OUTPUT"

  dkms:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: actions/download-artifact@v4
        with:
          name: debs-${{ matrix.series }}-${{ matrix.target }}
          path: ../build
      - name: podman
        run: sudo apt-get update -qq && sudo apt-get install -y podman python3-yaml
      - name: build module against every kernel in kernels.yaml
        run: tests/module-build/run.sh ${{ matrix.series }} ${{ matrix.target }}
        continue-on-error: ${{ !matrix.blocking }}
