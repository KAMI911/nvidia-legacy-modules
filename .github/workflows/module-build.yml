name: module-build

on:
  # not pull_request: directly -- needs build-reprotest's artifact, see
  # pr-checks.yml for the properly ordered chain.
  workflow_call:
    inputs:
      full: { type: boolean, default: false }

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: "${{ steps.g.outputs.m }}"
    steps:
      - uses: actions/checkout@v5
      - run: pipx install pyyaml || pip install pyyaml
      - id: g
        run: |
          SEL=""; [ "${{ inputs.full }}" = "true" ] || SEL="--series 390xx"
          echo "m=$(python3 .github/scripts/gen-matrix.py $SEL)" >> "$GITHUB_OUTPUT"

  dkms:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: actions/download-artifact@v4
        with:
          name: debs-${{ matrix.series }}-${{ matrix.target }}
          path: ../build
      - name: podman
        run: sudo apt-get update -qq && sudo apt-get install -y podman python3-yaml
      - name: build module against every kernel in kernels.yaml
        id: test
        run: tests/module-build/run.sh ${{ matrix.series }} ${{ matrix.target }}
        continue-on-error: ${{ !matrix.blocking }}
      - name: emit dkms verdict
        if: always()
        run: |
          python3 .github/scripts/emit-verdict.py "${{ matrix.series }}" "${{ matrix.target }}" \
            "${{ steps.test.outcome }}" "verdict-${{ matrix.series }}-${{ matrix.target }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdict-dkms-${{ matrix.series }}-${{ matrix.target }}
          path: verdict-${{ matrix.series }}-${{ matrix.target }}.json
          if-no-files-found: ignore

  verdicts:
    needs: dkms
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { pattern: verdict-dkms-*, path: verdicts, merge-multiple: true }
      - run: python3 .github/scripts/combine-verdicts.py dkms verdicts dkms-verdicts.json
      - uses: actions/upload-artifact@v4
        with: { name: dkms-verdicts, path: dkms-verdicts.json }
