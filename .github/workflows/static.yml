name: static

on:
  push: { branches: [main] }
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: |
          apt-get update -qq
          apt-get install -y -qq git python3-yaml shellcheck lintian devscripts \
            blhc dpkg-dev codespell
      - uses: actions/checkout@v5
        with: { submodules: true }
      - name: static gate
        run: .github/scripts/static-checks.sh
      - name: codespell
        run: codespell --skip='.git,*.run' -L crate,ba,te || true
      - name: render sanity (all combos)
        run: python3 .github/scripts/render-all.py --flavour dkms
      - name: emit static verdict (pass)
        if: success()
        run: python3 .github/scripts/emit-static-verdicts.py pass static-verdicts.json
      - name: emit static verdict (fail)
        if: failure()
        run: python3 .github/scripts/emit-static-verdicts.py fail static-verdicts.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-verdicts
          path: static-verdicts.json
