name: static

on:
  push: { branches: [main] }
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: |
          apt-get update -qq
          apt-get install -y -qq git python3-yaml shellcheck lintian devscripts \
            blhc dpkg-dev codespell
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: static gate
        run: .github/scripts/static-checks.sh
      - name: codespell
        run: codespell --skip='.git,*.run' -L crate,ba,te || true
      - name: render sanity (all combos)
        run: |
          python3 -c '
          import json,subprocess
          m=json.loads(subprocess.check_output(["python3",".github/scripts/gen-matrix.py"]))
          for c in m["include"]:
              subprocess.check_call(["python3","common/scripts/render-debian.py",
                "--series",c["series"],"--target",c["target"],
                "--flavour","dkms","--out",f"/tmp/r/{c[\"series\"]}/{c[\"target\"]}"])
          '
