name: release

# Full matrix. Only combos that pass every BLOCKING stage get published to OBS.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      series: { description: 'single series (blank = all)', required: false }

permissions:
  contents: write

jobs:
  static:
    uses: ./.github/workflows/static.yml

  build:
    needs: static
    uses: ./.github/workflows/build-reprotest.yml
    with: { full: true }

  dkms:
    needs: build
    uses: ./.github/workflows/module-build.yml
    with: { full: true }

  autopkgtest:
    needs: build
    uses: ./.github/workflows/autopkgtest.yml
    with: { full: true }

  qemu:
    needs: build
    uses: ./.github/workflows/qemu.yml
    with: { full: true }

  publish:
    needs: [static, build, dkms, autopkgtest, qemu]
    runs-on: ubuntu-latest
    environment: obs            # requires manual approval + holds OSC_* secrets
    env:
      OBS_PROJECT: ${{ vars.OSC_PROJECT || 'home:KAMI911:nvidia-legacy:modules' }}
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: actions/download-artifact@v4
        with: { path: ../build, merge-multiple: true }
      - name: osc
        run: |
          sudo apt-get update -qq && sudo apt-get install -y osc python3-yaml
          mkdir -p ~/.config/osc
          cat > ~/.config/osc/oscrc <<EOF
          [general]
          apiurl = ${{ vars.OSC_APIURL || 'https://api.opensuse.org' }}
          [${{ vars.OSC_APIURL || 'https://api.opensuse.org' }}]
          user = ${{ secrets.OSC_USER }}
          pass = ${{ secrets.OSC_PASS }}
          EOF
      - name: compute which combos passed every blocking stage
        id: gate
        run: |
          # Each reusable workflow uploads a <stage>-verdicts.json artifact of
          # {series/target: pass|fail|skip}. Intersect them.
          python3 .github/scripts/release-gate.py ../build > passed.txt
          cat passed.txt
      - name: sync source packages to OBS + set publish flags
        run: |
          # obs-sync.sh syncs EVERY ABI of a series in one pass, so run it once
          # per series, not once per (series,target) row — passed.txt has one
          # row per green target, and re-running the whole series per row was
          # multiplying the sync work ~7x (one per distro target) and blowing
          # past the job's 6h timeout before publish flags were even reached.
          cut -d' ' -f1 passed.txt | sort -u | while read -r series; do
            [ -n "$series" ] || continue
            echo "sync $series"
            BUILDDIR=../build tools/obs-sync.sh "$series"
          done
          while read -r series target; do
            echo "publish $series/$target"
            python3 .github/scripts/obs-set-publish.py "$series" "$target" enable
          done < passed.txt
      - name: disable publish for combos that did NOT pass
        run: python3 .github/scripts/obs-set-publish.py --disable-missing passed.txt
