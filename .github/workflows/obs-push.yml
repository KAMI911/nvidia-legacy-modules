name: obs-push

# Expand tools/kernels.yaml into per-ABI source packages and push them to OBS
# (build on, only in the matching distro repo; publish off).
# Standalone for iteration; reused by release.yml.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      series:
        description: 'space-separated series, or "all"'
        default: 'all'
      target:
        description: 'limit to one target (blank = all)'
        default: ''
      abi:
        description: 'limit to one ABI (blank = all)'
        default: ''
      project_config:
        description: 'also apply _obs project meta + prjconf first'
        type: boolean
        default: true
      xz_level:
        description: '.orig.tar.xz compression (xz flags); -9e is small but slow, -3 is much faster/bigger'
        default: '-3'

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    environment: obs
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }

      - name: osc
        env:
          OSC_USER: ${{ secrets.OSC_USER }}
          OSC_PASS: ${{ secrets.OSC_PASS }}
        run: |
          test -n "$OSC_USER" && test -n "$OSC_PASS" || {
            echo "::error::OSC_USER / OSC_PASS secrets not set — see _obs/README.md"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq osc python3-yaml dpkg-dev xz-utils curl
          mkdir -p ~/.config/osc
          APIURL="${{ vars.OSC_APIURL || 'https://api.opensuse.org' }}"
          cat > ~/.config/osc/oscrc <<EOF
          [general]
          apiurl = $APIURL
          [$APIURL]
          user = $OSC_USER
          pass = $OSC_PASS
          credentials_mgr_class = osc.credentials.PlaintextConfigFileCredentialsManager
          EOF
          chmod 600 ~/.config/osc/oscrc
          osc -A "$APIURL" whois

      - name: apply project meta + prjconf
        if: ${{ github.event.inputs.project_config != 'false' }}
        env:
          OBS_PROJECT: ${{ vars.OSC_PROJECT || 'home:KAMI911:nvidia-legacy:modules' }}
        run: |
          _obs/render.sh prj > /tmp/prj-meta.xml
          echo "--- project meta ($OBS_PROJECT) ---"; cat /tmp/prj-meta.xml
          osc meta prj     "$OBS_PROJECT" -F /tmp/prj-meta.xml
          osc meta prjconf "$OBS_PROJECT" -F _obs/prjconf

      - name: pick series
        id: pick
        run: |
          want='${{ github.event.inputs.series || 'all' }}'
          if [ "$want" = all ] || [ -z "$want" ]; then
            want=$(python3 -c "import yaml;print(' '.join(yaml.safe_load(open('series.yaml'))['build']))")
          fi
          echo "series=$want" >> "$GITHUB_OUTPUT"; echo "series: $want"

      - name: gen + assemble + push
        env:
          OBS_PROJECT: ${{ vars.OSC_PROJECT || 'home:KAMI911:nvidia-legacy:modules' }}
          NVL_XZ_LEVEL: ${{ github.event.inputs.xz_level || '-3' }}
          FILT_TARGET: ${{ github.event.inputs.target }}
          FILT_ABI: ${{ github.event.inputs.abi }}
        run: |
          B="$RUNNER_TEMP/src"; mkdir -p "$B"
          args=()
          [ -n "$FILT_TARGET" ] && args+=(--target "$FILT_TARGET")
          [ -n "$FILT_ABI" ]    && args+=(--abi "$FILT_ABI")
          for s in ${{ steps.pick.outputs.series }}; do
            python3 tools/gen-kernel-packages.py --series "$s" "${args[@]}"
            common/scripts/verify-run.sh "$s"
            common/scripts/assemble-source.sh "$s" "$B"
            BUILDDIR="$B" tools/obs-sync.sh "$s" \
              ${FILT_TARGET:+--target "$FILT_TARGET"} ${FILT_ABI:+--abi "$FILT_ABI"}
          done

      - run: echo "OBS builds per-ABI now; publish stays off until obs-set-publish.py enables a repo."
