# nvidia-legacy build set
flavour: modules
build:
  580xx:
    targets:
    - debian12
    - debian13
    - ubuntu2204
    - ubuntu2404
    archs:
      debian:
      - amd64
      ubuntu:
      - amd64
    blocking: true
    note: "Maxwell/Pascal/Volta; amd64 only; active upstream \u2014 bump version on\
      \ respin"
  580xx-open:
    targets:
    - debian12
    - debian13
    - ubuntu2204
    - ubuntu2404
    archs:
      debian:
      - amd64
      ubuntu:
      - amd64
    blocking: true
    note: open kernel-open/ modules (MIT/GPL-2); same userspace as 580xx
  470xx:
    targets:
    - debian11
    - debian12
    - debian13
    - ubuntu2204
    - ubuntu2404
    archs:
      debian:
      - amd64
      ubuntu:
      - amd64
    blocking: true
    note: amd64 kernel only (no i386 upstream); i386 libs via multiarch
  390xx:
    targets:
    - debian11
    - debian12
    - debian13
    - ubuntu2204
    - ubuntu2404
    archs:
      debian:
      - amd64
      - i386
      ubuntu:
      - amd64
    blocking: true
  340xx:
    targets:
    - debian11
    - debian12
    - debian13
    - ubuntu2204
    - ubuntu2404
    archs:
      debian:
      - amd64
      - i386
      ubuntu:
      - amd64
    blocking: true
  304xx:
    targets:
    - debian11
    - debian12
    - debian13
    - ubuntu2204
    - ubuntu2404
    archs:
      debian:
      - amd64
      - i386
      ubuntu:
      - amd64
    blocking: false
    note: kernel module + libs + VDPAU everywhere; X via xorg-server-legacy-nvidia-23
  173xx:
    targets:
    - debian12
    - debian13
    - ubuntu2204
    - ubuntu2404
    archs:
      debian:
      - amd64
      - i386
      ubuntu:
      - amd64
    blocking: false
    note: EXPERIMENTAL forward-port; X via xorg-server-legacy-nvidia-19; compile-only
      until hardware
  96xx:
    targets:
    - debian12
    - debian13
    - ubuntu2204
    - ubuntu2404
    archs:
      debian:
      - amd64
      - i386
      ubuntu:
      - amd64
    blocking: false
    note: EXPERIMENTAL forward-port; X via xorg-server-legacy-nvidia-12; compile-only
      until hardware
  71xx:
    targets:
    - debian12
    - debian13
    - ubuntu2204
    - ubuntu2404
    archs:
      debian:
      - amd64
      - i386
      ubuntu:
      - amd64
    blocking: false
    note: EXPERIMENTAL forward-port; X via xorg-server-legacy-nvidia-2; compile-only
      until hardware
